openapi: 3.1.0
info:
  title: SINGCHRONIZE
  version: 0.1.0
paths:
  /api/v1/auth/login/{provider}:
    post:
      tags:
      - Auth
      summary: 소셜 로그인 (카카오 / 네이버)
      description: 프론트엔드가 발급받은 OAuth 액세스 토큰을 전달하면, 사용자 정보를 조회하고 우리 서비스 JWT를 발급합니다.
      operationId: social_login_api_v1_auth_login__provider__post
      parameters:
      - name: provider
        in: path
        required: true
        schema:
          type: string
          title: Provider
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SocialLoginRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: 토큰 갱신 (RTR)
      description: Authorization 헤더에 리프레시 토큰을 담아 보내면, 기존 토큰을 폐기하고 새 토큰 쌍을 발급합니다.
      operationId: refresh_api_v1_auth_refresh_post
      security:
      - HTTPBearer: []
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/withdraw:
    post:
      tags:
      - Auth
      summary: 회원 탈퇴
      description: 현재 로그인된 사용자를 탈퇴 처리합니다.
      operationId: withdraw_api_v1_auth_withdraw_post
      security:
      - HTTPBearer: []
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WithdrawRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/me:
    get:
      tags:
      - Users
      summary: 내 정보 조회
      description: 현재 로그인된 사용자의 정보를 반환합니다. 캐시된 보컬 분석 정보(vocal_summary)도 포함됩니다.
      operationId: get_me_api_v1_users_me_get
      security:
      - HTTPBearer: []
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Users
      summary: 프로필 수정
      operationId: update_profile_api_v1_users_me_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/users/me/settings:
    patch:
      tags:
      - Users
      summary: 설정 변경 (JSONB 부분 업데이트)
      description: '전달된 키만 기존 settings에 머지합니다. 예: `{"push_enabled": false}` → push_enabled만
        변경.'
      operationId: update_settings_api_v1_users_me_settings_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Update Settings Api V1 Users Me Settings Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/music/search:
    get:
      tags:
      - music
      summary: Search Music
      operationId: search_music_api_v1_music_search_get
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/library/folders:
    get:
      tags:
      - Library
      summary: Get Folders
      description: 사용자의 모든 폴더 조회 (아이템 개수 포함)
      operationId: get_folders_api_v1_library_folders_get
      security:
      - HTTPBearer: []
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FolderResponse'
                title: Response Get Folders Api V1 Library Folders Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Library
      summary: Create Folder
      description: 새 폴더 생성
      operationId: create_folder_api_v1_library_folders_post
      security:
      - HTTPBearer: []
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FolderCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/library/folders/{folder_id}:
    delete:
      tags:
      - Library
      summary: Delete Folder
      description: 폴더 삭제 (시스템 폴더는 삭제 불가)
      operationId: delete_folder_api_v1_library_folders__folder_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: folder_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Folder Id
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/library/wishlist:
    get:
      tags:
      - Library
      summary: Get Wishlist
      description: 위시리스트 아이템 조회
      operationId: get_wishlist_api_v1_library_wishlist_get
      security:
      - HTTPBearer: []
      parameters:
      - name: folder_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: 폴더 ID (없으면 전체)
          title: Folder Id
        description: 폴더 ID (없으면 전체)
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: 정렬 기준 (LATEST)
          default: LATEST
          title: Sort
        description: 정렬 기준 (LATEST)
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WishlistItemResponse'
                title: Response Get Wishlist Api V1 Library Wishlist Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Library
      summary: Add Wishlist Item
      description: 위시리스트에 곡 추가
      operationId: add_wishlist_item_api_v1_library_wishlist_post
      security:
      - HTTPBearer: []
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WishlistItemCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistItemResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/library/wishlist/{item_id}:
    delete:
      tags:
      - Library
      summary: Delete Wishlist Item
      description: 위시리스트 아이템 삭제
      operationId: delete_wishlist_item_api_v1_library_wishlist__item_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Item Id
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/library/history:
    get:
      tags:
      - Library
      summary: Get History
      description: 부른 노래 기록 조회
      operationId: get_history_api_v1_library_history_get
      security:
      - HTTPBearer: []
      parameters:
      - name: tag
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: '태그 필터 (예: AGAIN, HIGH_PITCH)'
          title: Tag
        description: '태그 필터 (예: AGAIN, HIGH_PITCH)'
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ArchiveResponse'
                title: Response Get History Api V1 Library History Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Library
      summary: Create History
      description: 부른 노래 기록 저장
      operationId: create_history_api_v1_library_history_post
      security:
      - HTTPBearer: []
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/library/history/{archive_id}:
    patch:
      tags:
      - Library
      summary: Update History
      description: 부른 노래 기록 수정 (태그, 메모)
      operationId: update_history_api_v1_library_history__archive_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: archive_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Archive Id
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArchiveUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArchiveResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Library
      summary: Delete History
      description: 부른 노래 기록 삭제
      operationId: delete_history_api_v1_library_history__archive_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: archive_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Archive Id
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/busking/rooms:
    post:
      tags:
      - Busking
      summary: Create Room
      description: 버스킹 방 생성 (로그인 필수)
      operationId: create_room_api_v1_busking_rooms_post
      security:
      - HTTPBearer: []
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BuskingRoomCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuskingRoomResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Busking
      summary: Get Rooms
      description: 현재 라이브 중이거나 준비 중인 방 목록 조회
      operationId: get_rooms_api_v1_busking_rooms_get
      parameters:
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BuskingRoomResponse'
                title: Response Get Rooms Api V1 Busking Rooms Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/test/kakao/login:
    get:
      tags:
      - OAuth Test
      summary: Kakao Login
      description: 카카오 로그인 페이지로 리다이렉트
      operationId: kakao_login_auth_test_kakao_login_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/test/kakao/callback:
    get:
      tags:
      - OAuth Test
      summary: Kakao Callback
      description: 카카오 콜백 → 인가코드로 토큰 교환 → JWT 발급 → 테스트 페이지로 리다이렉트
      operationId: kakao_callback_auth_test_kakao_callback_get
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
          title: Code
      - name: args
        in: query
        required: true
        schema:
          title: Args
      - name: kwargs
        in: query
        required: true
        schema:
          title: Kwargs
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      summary: Health Check
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    ArchiveCreate:
      properties:
        song_id:
          type: string
          format: uuid
          title: Song Id
        tags:
          items:
            type: string
          type: array
          title: Tags
          default: []
        memo:
          anyOf:
          - type: string
          - type: 'null'
          title: Memo
      type: object
      required:
      - song_id
      title: ArchiveCreate
    ArchiveResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        song:
          anyOf:
          - $ref: '#/components/schemas/ArchiveSongInfo'
          - type: 'null'
        tags:
          items:
            type: string
          type: array
          title: Tags
          default: []
        memo:
          anyOf:
          - type: string
          - type: 'null'
          title: Memo
        recorded_date:
          type: string
          format: date-time
          title: Recorded Date
      type: object
      required:
      - id
      - user_id
      - recorded_date
      title: ArchiveResponse
    ArchiveSongInfo:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        title:
          type: string
          title: Title
        artist:
          type: string
          title: Artist
        album_cover:
          anyOf:
          - type: string
          - type: 'null'
          title: Album Cover
      type: object
      required:
      - id
      - title
      - artist
      title: ArchiveSongInfo
    ArchiveUpdate:
      properties:
        tags:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Tags
        memo:
          anyOf:
          - type: string
          - type: 'null'
          title: Memo
      type: object
      title: ArchiveUpdate
    BuskingRoomCreate:
      properties:
        title:
          type: string
          title: Title
        thumbnail:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail
      type: object
      required:
      - title
      title: BuskingRoomCreate
    BuskingRoomResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        host_id:
          type: string
          format: uuid
          title: Host Id
        title:
          type: string
          title: Title
        thumbnail:
          anyOf:
          - type: string
          - type: 'null'
          title: Thumbnail
        status:
          type: string
          title: Status
        total_viewers:
          type: integer
          title: Total Viewers
        started_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Started At
      type: object
      required:
      - id
      - host_id
      - title
      - thumbnail
      - status
      - total_viewers
      - started_at
      title: BuskingRoomResponse
    FolderCreate:
      properties:
        name:
          type: string
          title: Name
      type: object
      required:
      - name
      title: FolderCreate
    FolderResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        user_id:
          type: string
          format: uuid
          title: User Id
        name:
          type: string
          title: Name
        is_system:
          type: boolean
          title: Is System
        created_at:
          type: string
          format: date-time
          title: Created At
        item_count:
          type: integer
          title: Item Count
          default: 0
      type: object
      required:
      - id
      - user_id
      - name
      - is_system
      - created_at
      title: FolderResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        refresh_token:
          type: string
          title: Refresh Token
        token_type:
          type: string
          title: Token Type
          default: bearer
        is_new_user:
          type: boolean
          title: Is New User
      type: object
      required:
      - access_token
      - refresh_token
      - is_new_user
      title: LoginResponse
      description: POST /auth/login/{provider} 응답
